<style>
  .caret { animation: blink 1s steps(1, end) infinite; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  .hop { animation: hop 4s steps(1, end) infinite; }
  @keyframes hop { 0% { transform: translateY(-3px); } 5% { transform: none; } }

  .led { animation: blink 1s steps(1, end) infinite; animation-delay: -.25s; }
  .bob { animation: bob 1s steps(1, end) infinite; }
  @keyframes bob { 0% { transform: none; } 50% { transform: translateY(-2px); } }
  .beep { opacity: 0; animation: beep 4s steps(1, end) infinite; }
  @keyframes beep { 0% { opacity: 0; } 50% { opacity: 1; } 80% { opacity: 0; } }
  .roll { animation: roll 4s steps(40, end) infinite; }
  @keyframes roll { from { transform: none; } to { transform: translateY(80px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
