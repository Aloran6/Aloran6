<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Hi there 👋">
  <title>Hi there 👋</title>
  <defs>
    <clipPath id="card"><rect width="1000" height="240" rx="20"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b1a"/>
      <stop offset="1" stop-color="#1a1035"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="0.35" stop-color="#f0abfc"/>
      <stop offset="0.65" stop-color="#fbcfe8"/>
      <stop offset="1" stop-color="#c7d2fe"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1000 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow-indigo"><stop offset="0" stop-color="#6366f1"/><stop offset="0.4" stop-color="#6366f1" stop-opacity="0.85"/><stop offset="0.7" stop-color="#6366f1" stop-opacity="0.35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-pink"><stop offset="0" stop-color="#ec4899"/><stop offset="0.4" stop-color="#ec4899" stop-opacity="0.85"/><stop offset="0.7" stop-color="#ec4899" stop-opacity="0.35"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-violet"><stop offset="0" stop-color="#8b5cf6"/><stop offset="0.4" stop-color="#8b5cf6" stop-opacity="0.85"/><stop offset="0.7" stop-color="#8b5cf6" stop-opacity="0.35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0b0b1a" flood-opacity="0.65"/>
    </filter>
    <path id="star" d="M0-8C1-2 2-1 8 0 2 1 1 2 0 8-1 2-2 1-8 0-2-1-1-2 0-8Z"/>
  </defs>
  <style>
    .title { font: 800 92px "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -1px; }
    .hand { font: 84px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
    .rise { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .tw { animation: tw 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .tw.d1 { animation-delay: .8s; } .tw.d2 { animation-delay: 1.6s; } .tw.d3 { animation-delay: 2.2s; }
    @keyframes tw { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .rise, .tw { animation: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <g opacity="0.6">
      <circle cx="200" cy="60" r="220" fill="url(#glow-indigo)">
        <animateTransform attributeName="transform" type="translate" values="0 0;140 60;0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="780" cy="200" r="230" fill="url(#glow-pink)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-160 -50;0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="20" r="200" fill="url(#glow-violet)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-80 90;0 0" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#ffffff">
      <use href="#star" class="tw" x="120" y="60"/>
      <use href="#star" class="tw d1" x="880" y="56"/>
      <use href="#star" class="tw d2" x="842" y="190" transform="scale(1)"/>
      <use href="#star" class="tw d3" x="170" y="185"/>
    </g>
    <g class="rise">
      <text class="title" x="455" y="152" text-anchor="middle" fill="url(#ink)" filter="url(#glow)">Hi there</text>
      <text class="hand" x="690" y="150" text-anchor="middle">👋</text>
    </g>
  </g>
</svg>
