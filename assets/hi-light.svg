<svg xmlns="http://www.w3.org/2000/svg" width="240" height="40" viewBox="0 0 240 40" role="img" aria-label="Hi there 👋">
  <title>Hi there 👋</title>
  <style>
    text { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; fill: #1f2328; }
    .caret { font-weight: 300; animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
  </style>
  <text x="0" y="29">Hi there 👋<tspan class="caret" dx="4">|</tspan></text>
</svg>
