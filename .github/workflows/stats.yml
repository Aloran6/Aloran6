# Builds the profile README's stats and top-languages cards
# and publishes them to the `output` branch, which README.md embeds.
name: Profile stats

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

env:
  STATS_COMMON: custom_title=GitHub%20Stats&show_icons=true&include_all_commits=true&hide=stars,issues,contribs&show=prs_merged&hide_title=true&hide_border=true&bg_color=00000000&ring_color=8b5cf6
  LANGS_COMMON: layout=compact&langs_count=6&hide_border=true&bg_color=00000000
  STATS_CORE: 2.3.1 # @stats-organization/github-readme-stats-core

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS_COMMON }}&title_color=7c3aed&icon_color=4f46e5&text_color=1f2328
          path: dist/stats-light.svg
          core_version: ${{ env.STATS_CORE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS_COMMON }}&title_color=c084fc&icon_color=818cf8&text_color=c9d1d9
          path: dist/stats-dark.svg
          core_version: ${{ env.STATS_CORE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS_COMMON }}&title_color=7c3aed&text_color=1f2328
          path: dist/top-langs-light.svg
          core_version: ${{ env.STATS_CORE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS_COMMON }}&title_color=c084fc&text_color=c9d1d9
          path: dist/top-langs-dark.svg
          core_version: ${{ env.STATS_CORE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
